# Cloudflare Workers + Static Assets + D1.
#
# El proyecto de Cloudflare es un Worker con integración Git (Workers Builds),
# no un proyecto Pages. De ahí que la URL pública termine en `workers.dev` y
# que el paso de publicación ejecute `wrangler deploy`. Durante el bloque de
# cuentas este archivo se escribió como si fuera Pages
# (`pages_build_output_dir`), y eso rompía la publicación: `wrangler deploy`
# busca un Worker o un directorio de assets y no encontraba ninguno de los dos.
#
# `functions/` sigue siendo el servidor, pero como origen. `npm run build` lo
# compila con `wrangler pages functions build` a `.worker/index.js`, y
# `wrangler deploy` publica ese Worker junto al build de Vite (`dist/`). El
# sitio sigue siendo un solo origen: sin CORS y con `SameSite=Lax` suficiente
# para la cookie de sesión.
#
# No se pide `nodejs_compat`. El código del servidor está escrito contra
# funciones web estándar (`fetch`, `crypto.subtle`, `TextEncoder`, `URL`), que
# la plataforma ya tiene, así que no hace falta ninguna pieza de Node ni su
# polyfill.
#
# DESPLIEGUE: integración Git. Cloudflare ejecuta `npm run build` y después
# `wrangler deploy` en cada push a main, así que para actualizar el sitio no
# hace falta Wrangler a mano. Si algún día hay que publicar a mano:
#
#   npm run deploy

name = "the-last-turn"
compatibility_date = "2025-03-01"

# Worker compilado desde `functions/`. Lo genera `npm run build` con el script
# `build:functions`. No se edita a mano ni se sube a git.
main = ".worker/index.js"

# `dist/` es el build de Vite. El binding `ASSETS` es obligatorio: el Worker
# compilado resuelve con `env.ASSETS.fetch(...)` las rutas que no son API.
[assets]
directory = "./dist"
binding = "ASSETS"

# D1 va comentado a propósito, y no por descuido.
#
# Un `database_id` de relleno rompe la compilación del despliegue: Cloudflare
# valida el identificador al leer este archivo, así que un UUID que no existe no
# es un aviso, es un error. Con el bloque comentado el sitio se publica, el juego
# funciona entero y `/api/health` responde 503 diciendo que la base de datos no
# responde, que es exactamente la verdad y se arregla en cuanto la haya.
#
# Para activarlo, en este orden:
#
#   npx wrangler d1 create the-last-turn     # devuelve el database_id
#   # pegar el database_id de verdad en las dos líneas siguientes
#   npm run db:migrate                       # aplica migrations/ en la real
#
# En local, `npm run db:migrate:local` crea y aplica la copia sin tocar la real.
# [[d1_databases]]
# binding = "DB"
# database_name = "the-last-turn"
# database_id = "EL_UUID_QUE_DEVUELVA_wrangler_d1_create"
# migrations_dir = "migrations"
